name: Offline export regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline check tools
        run: |
          python -m pip install pandas pytest ruff build hatchling
          python -m pip install -e .
      - name: Check changed Python files
        run: |
          ruff check sqldeps/models.py tests/unit/test_models.py
          ruff format --check sqldeps/models.py tests/unit/test_models.py
      - name: Run offline regressions
        run: python -m pytest tests/unit/test_models.py -q
      - name: Build wheel
        run: python -m build --wheel --no-isolation
